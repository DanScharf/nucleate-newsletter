<style>
/* Layout: navy masthead band with the helix mark, tab rail on the band, light working surface below. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --sunk:#E9EEF3; --ink:#0F1D2E; --muted:#58697C; --line:#D8E0E8;
  --band:#10223B; --band-2:#16304F; --band-ink:#EAF2FA; --band-muted:#9FB3C8;
  --accent:#0C8C7E; --accent-ink:#FFFFFF; --accent-soft:#DCF2EE;
  --coral:#D9503B; --coral-soft:#FBE5E0; --warn:#A86500; --warn-soft:#FBF0D9; --ok:#1F7A55; --ok-soft:#DFF1E8;
  --helix-a:#36C3B0; --helix-b:#F2735E; --helix-rung:#6E86A3;
  --t-event:#0C8C7E; --t-funding:#B7791F; --t-job:#5B5BD6; --t-research:#2F7BC0; --t-industry:#6B7A8C; --t-opportunity:#D9503B; --t-tool:#8A5CC2;
  --m-meeting:#2F7BC0; --m-call:#5B5BD6; --m-idea:#D9503B; --m-other:#6B7A8C; --m-plan:#B7791F;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(15,29,46,.06),0 4px 14px rgba(15,29,46,.05);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A121C; --surface:#111C29; --sunk:#0D1722; --ink:#E5EDF5; --muted:#8FA1B4; --line:#223142;
  --band:#08111C; --band-2:#0F1E30; --band-ink:#EAF2FA; --band-muted:#8FA1B4;
  --accent:#3CCFBC; --accent-ink:#06201C; --accent-soft:#0F302C; --coral:#FF7C66; --coral-soft:#3A1E19; --warn:#F2BE5C; --warn-soft:#33280F; --ok:#6FD3A5; --ok-soft:#14302A;
  --helix-rung:#4A607A;
  --t-event:#3CCFBC; --t-funding:#F2BE5C; --t-job:#9C9CF5; --t-research:#6FB2F0; --t-industry:#A3B1C2; --t-opportunity:#FF7C66; --t-tool:#C29CF0;
  --m-meeting:#6FB2F0; --m-call:#9C9CF5; --m-idea:#FF7C66; --m-other:#A3B1C2; --m-plan:#F2BE5C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121C; --surface:#111C29; --sunk:#0D1722; --ink:#E5EDF5; --muted:#8FA1B4; --line:#223142;
  --band:#08111C; --band-2:#0F1E30; --band-ink:#EAF2FA; --band-muted:#8FA1B4;
  --accent:#3CCFBC; --accent-ink:#06201C; --accent-soft:#0F302C; --coral:#FF7C66; --coral-soft:#3A1E19; --warn:#F2BE5C; --warn-soft:#33280F; --ok:#6FD3A5; --ok-soft:#14302A;
  --helix-rung:#4A607A;
  --t-event:#3CCFBC; --t-funding:#F2BE5C; --t-job:#9C9CF5; --t-research:#6FB2F0; --t-industry:#A3B1C2; --t-opportunity:#FF7C66; --t-tool:#C29CF0;
  --m-meeting:#6FB2F0; --m-call:#9C9CF5; --m-idea:#FF7C66; --m-other:#A3B1C2; --m-plan:#F2BE5C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
img{max-width:100%} [hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)} code{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

/* masthead */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.mast{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand svg{flex:none}
.brand .n1{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1}
.brand .n2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted);line-height:1.4}
.mast .sp{flex:1}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--band-muted)}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 12px 10px;text-decoration:none;color:var(--band-muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--band-ink)}
.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--helix-a)}
.tabs a .n{font-family:var(--mono);font-size:11px;margin-left:5px;opacity:.75}
main{padding-block:22px 64px}

/* controls */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--coral)}
.btn[disabled]{opacity:.5;cursor:default}
header .btn{background:transparent;border-color:rgba(255,255,255,.18);color:var(--band-ink)}
header .btn:hover{border-color:rgba(255,255,255,.4)}
header .btn.pri{background:var(--helix-a);border-color:var(--helix-a);color:#06201C}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-size:14px;font-weight:400}
label.f .req{color:var(--coral)}
.lh{display:flex;gap:8px;align-items:baseline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
.sub{color:var(--muted);margin:0 0 18px;max-width:65ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}

/* type chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap}
.chip .dot,.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.chip.type{background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.chip.hot{background:var(--coral-soft);color:var(--coral)} .chip.soon{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)}
.typepick{display:flex;flex-wrap:wrap;gap:6px}
.typepick input{position:absolute;opacity:0;pointer-events:none}
.typepick label{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;background:var(--surface);color:var(--ink)}
.typepick label .dot{color:var(--tc)}
.typepick input:checked+label{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface));font-weight:600}
.typepick input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}

/* hero (home + landing) */
.hero{position:relative;overflow:hidden;background:var(--band);border:1px solid rgba(255,255,255,.07);color:var(--band-ink);border-radius:18px;padding:28px 28px 26px;margin-bottom:20px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .hx{position:relative;max-width:560px}
.hero .kicker{font-family:var(--mono);font-size:12px;color:var(--helix-a);letter-spacing:.06em}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,48px);line-height:1.02;margin:8px 0 10px;letter-spacing:-.02em;text-wrap:balance}
.hero h1 .dash{color:var(--helix-b)}
.hero p{margin:0;color:var(--band-muted);max-width:46ch}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--band-ink)}
.hero .btn.pri{background:var(--helix-a);border-color:var(--helix-a);color:#06201C;font-weight:600}
.landing{min-height:calc(100vh - 160px);border-radius:22px;padding:40px 32px;justify-content:center}
.landing .hx{max-width:620px}
.landing h1{font-size:clamp(38px,7vw,72px)}
.landing .note{margin-top:14px;font-size:13px;color:var(--band-muted)}
@media (max-width:640px){.landing{justify-content:flex-end;padding:180px 22px 28px;min-height:calc(100vh - 150px)}.hero{padding-top:150px}}
.landing .err{margin-top:12px;background:rgba(255,124,102,.14);color:#FFD4CC;padding:8px 12px;border-radius:9px;display:inline-block}

/* home */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .v{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .v.small{font-size:17px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tile .l{font-size:12.5px;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.home-grid{grid-template-columns:1fr}}
.quick{display:flex;gap:8px}
.quick input{flex:1}
.agenda{display:flex;flex-direction:column}
.ag{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.ag:first-child{border-top:0}
.ag .dt{width:46px;flex:none;text-align:center;border-radius:9px;background:var(--sunk);padding:4px 0;line-height:1.1}
.ag .dt .d{font-family:var(--display);font-weight:800;font-size:18px}
.ag .dt .m{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ag .bd{min-width:0;flex:1}
.ag .t{font-weight:600;overflow-wrap:anywhere}
.ag .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ag .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--tc);flex:none}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
@media (max-width:700px){.board{grid-template-columns:repeat(5,84%);scroll-snap-type:x mandatory}.col{scroll-snap-align:start;align-self:start}}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px;min-width:0}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.col-h .c{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.card:hover{border-color:var(--muted);border-left-color:var(--tc)}
.card[draggable=true]{cursor:grab}
.card .t{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);min-width:0}
.card .foot{display:flex;align-items:center;gap:6px;justify-content:space-between}
.card .foot .meta{flex:1;flex-wrap:nowrap}
.card .foot .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.votes{display:flex;gap:3px;flex:none}
.votes button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 7px;cursor:pointer;font-size:12px;white-space:nowrap}
.votes button.on{background:var(--accent-soft);border-color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{color:var(--ink);display:block;font-family:var(--display);font-size:18px;margin-bottom:4px}
.colempty{color:var(--muted);font-size:12.5px;padding:8px 4px}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;flex-wrap:wrap}
.row .grow{flex:1 1 240px;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.group-h{margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
.group-h:first-child{margin-top:0}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-h h3{font-size:20px;font-weight:800;min-width:170px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--sunk);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;font-weight:600}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;text-align:start;border:0;font:inherit;color:inherit}
.cal .day:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.cal .day.out{background:var(--sunk);color:var(--muted)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .num{font-family:var(--mono);font-size:12px;width:24px;height:24px;display:inline-grid;place-items:center;border-radius:50%}
.cal .day.today .num{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal .ev{display:block;font-size:11.5px;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--ink);border-left:3px solid var(--tc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .more{font-size:11px;color:var(--muted);padding-left:4px}
.cal .dots{display:none;gap:3px;flex-wrap:wrap}
@media (max-width:700px){.cal .day{min-height:56px;padding:4px;align-items:center}.cal .ev,.cal .more{display:none}.cal .dots{display:flex}.cal .dots .dot{color:var(--tc);width:6px;height:6px}}
.daypanel{margin-top:16px}

/* issue */
.issue-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.issue-grid{grid-template-columns:1fr}}
.phone{background:#0B141A;border-radius:22px;padding:16px;border:1px solid var(--line)}
.phone .eyebrow{color:#9FB0BA}
.bubble{background:#E7FFDB;color:#111B21;border-radius:4px 12px 12px 12px;padding:10px 12px;white-space:pre-wrap;unicode-bidi:plaintext;text-align:start;overflow-wrap:anywhere;font-size:13.5px;line-height:1.45;max-height:70vh;overflow:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bubble{background:#005C4B;color:#E9EDEF}}
:root[data-theme="dark"] .bubble{background:#005C4B;color:#E9EDEF}
.bubble b{font-weight:700}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.mini:first-of-type{border-top:0}
.mini .t{flex:1;min-width:0;overflow-wrap:anywhere}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:24px}
.person{display:flex;flex-direction:column;gap:10px}
.person .hd{display:flex;align-items:center;gap:10px}
.person .av{width:38px;height:38px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--sunk);border-radius:9px;padding:6px 8px}
.stat .v{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted)}
.feed{display:flex;flex-direction:column}
.ev-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ev-row:first-child{border-top:0}
.ev-row .when{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.ev-row .txt{min-width:0;overflow-wrap:anywhere}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(6,14,24,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(600px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.drawer .dh{display:flex;align-items:center;gap:8px}
.drawer .dh h2{flex:1;margin:0;font-size:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
details.more[open] summary{margin-bottom:12px}
.dup{background:var(--warn-soft);border-radius:9px;padding:8px 10px;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.comment{display:flex;gap:8px;align-items:flex-start}
.comment .b{background:var(--sunk);border-radius:9px;padding:6px 10px;min-width:0;overflow-wrap:anywhere;flex:1}
.comment .b .n{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--coral-soft);padding:8px 10px;border-radius:9px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:9px;z-index:60;font-size:13px}
.src-kind{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* tasks, segments, progress, mentions, toast action */
.tasks{display:flex;flex-direction:column}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none;cursor:pointer}
.task .grow{flex:1;min-width:0}
.task .t{font-weight:600;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.task .t:hover{text-decoration:underline}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.task .meta .av{width:18px;height:18px}
.taskAdd{display:flex;gap:8px;flex-wrap:wrap}
.taskAdd input[name=title]{flex:1 1 200px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sunk);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[disabled]{cursor:default}
.prog{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.prog span{display:block;height:100%;background:var(--m-plan);border-radius:6px}
.mention-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mchip{border:1px solid var(--line);cursor:pointer;background:var(--surface)}
.mchip:hover{border-color:var(--accent);color:var(--accent)}
b.men{color:var(--accent)}
.toast{display:flex;gap:12px;align-items:center}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:7px;padding:2px 9px;cursor:pointer;font-weight:600}

/* event planner */
.crumbs{margin-bottom:10px;font-size:13px}
.crumbs a{color:var(--muted);text-decoration:none} .crumbs a:hover{color:var(--accent)}
.evhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--m-plan);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.evtitle{display:flex;gap:12px;align-items:flex-start;min-width:0;flex:1 1 320px}
.evtitle .ic{font-size:30px;line-height:1}
.evtitle h2{margin-bottom:8px;overflow-wrap:anywhere}
.evtitle .meta{display:flex;flex-wrap:wrap;gap:6px}
.evtabs{display:flex;overflow-x:auto;max-width:100%;flex-wrap:nowrap;scrollbar-width:none}
.evtabs::-webkit-scrollbar{display:none}
.evtabs button{white-space:nowrap}
.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tpl input{position:absolute;opacity:0;pointer-events:none}
.tpl label{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);color:var(--ink);font-weight:400}
.tpl label .ic{font-size:20px} .tpl label b{font-size:13.5px} .tpl label span:last-child{font-size:12px;color:var(--muted)}
.tpl input:checked+label{border-color:var(--m-plan);box-shadow:0 0 0 2px color-mix(in srgb,var(--m-plan) 35%,transparent)}
.tpl input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.btable{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.bh,.br{display:grid;grid-template-columns:minmax(140px,2fr) 110px 110px minmax(110px,1fr) 44px 36px;gap:8px;align-items:center;min-width:600px}
.bh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 2px}
.br{border-top:1px solid var(--line);padding-top:6px}
.br input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);justify-self:center}
.evtask select,.evtask input[type=date]{flex:0 1 auto}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="mast">
      <a class="brand" href="#home" aria-label="Home">
        <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M7 2c0 10 16 20 16 30M23 2c0 10-16 20-16 30" stroke="var(--helix-a)" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M9.5 9h11M8.5 17h13M9.5 25h11" stroke="var(--helix-b)" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span><span class="n1">Nucleate</span><br><span class="n2">Technion Branch</span></span>
      </a>
      <div class="sp"></div>
      <div class="who" id="who"></div>
      <button class="btn sm" data-act="settings" id="btnSettings" hidden>Settings</button>
      <button class="btn sm ghost" data-auth="signout" id="btnSignOut" hidden>Sign out</button>
      <button class="btn pri" data-act="new" id="btnNew" hidden>+ Add item</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty"><b>Opening the desk…</b>Connecting to your shared workspace.</div><noscript><p>This site needs JavaScript turned on.</p></noscript></main>
<div id="layer"></div>

<script>
// ---------- DNA double helix (landing + home hero) ----------
(() => {
  const running = new Set();
  function draw(cv, t){
    const r = cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio||1);
    if (!r.width) return;
    if (cv.width !== Math.round(r.width*dpr) || cv.height !== Math.round(r.height*dpr)) { cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr); }
    const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,r.width,r.height);
    const cs = getComputedStyle(cv); const A = cs.getPropertyValue("--helix-a").trim(), B = cs.getPropertyValue("--helix-b").trim(), R = cs.getPropertyValue("--helix-rung").trim();
    const W = r.width, H = r.height; const narrow = W < 640;
    // helix runs diagonally on the right side (full width when narrow, faded behind text)
    const fx = parseFloat(cv.dataset.x0||"0.38"); const x0 = narrow ? -40 : W*fx, x1 = W + 40; const cy = narrow ? Math.min(H*0.2, 96) : H*0.5; const amp = narrow ? 38 : Math.min(H*0.28, 70); const k = (Math.PI*2)/ (narrow ? 210 : 260);
    const tilt = narrow ? 0 : -0.12;
    g.globalAlpha = 1;
    const pts = [];
    for (let x = x0; x <= x1; x += 4) { const ph = k*x + t; pts.push({x, y1: cy + tilt*(x-x0) + amp*Math.sin(ph), y2: cy + tilt*(x-x0) + amp*Math.sin(ph+Math.PI), z1: Math.cos(ph), z2: Math.cos(ph+Math.PI)}); }
    // rungs
    for (let i = 0; i < pts.length; i += 6) { const p = pts[i]; const depth = (p.z1+1)/2; g.strokeStyle = R; g.globalAlpha = 0.5*(0.4+0.6*Math.abs(Math.sin(k*p.x+t))); g.lineWidth = 2;
      g.beginPath(); g.moveTo(p.x, p.y1); g.lineTo(p.x, p.y2); g.stroke();
      const mid = (p.y1+p.y2)/2; g.lineWidth = 3; g.globalAlpha *= 1.3; g.strokeStyle = depth > .5 ? A : B; g.beginPath(); g.moveTo(p.x, p.y1); g.lineTo(p.x, mid); g.stroke(); g.strokeStyle = depth > .5 ? B : A; g.beginPath(); g.moveTo(p.x, mid); g.lineTo(p.x, p.y2); g.stroke(); }
    // strands: back first, then front, segment by segment for depth
    for (const pass of [0,1]) for (const [key, zk, col] of [["y1","z1",A],["y2","z2",B]]) {
      for (let i = 1; i < pts.length; i++) { const a = pts[i-1], b = pts[i]; const front = b[zk] > 0; if ((pass===1) !== front) continue;
        g.strokeStyle = col; g.globalAlpha = (front ? 1 : 0.35); g.lineWidth = front ? 5 : 3.5; g.lineCap = "round";
        g.beginPath(); g.moveTo(a.x, a[key]); g.lineTo(b.x, b[key]); g.stroke(); }
    }
    // nucleotide beads on the front
    for (let i = 0; i < pts.length; i += 6) { const p = pts[i]; for (const [y,z,c] of [[p.y1,p.z1,A],[p.y2,p.z2,B]]) { if (z <= 0.2) continue; g.globalAlpha = 1; g.fillStyle = c; g.beginPath(); g.arc(p.x, y, 3+2*z, 0, Math.PI*2); g.fill(); } }
    g.globalAlpha = 1;
  }
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let raf = 0, start = performance.now();
  function loop(now){ raf = 0; const t = (now - start)/1600; for (const cv of [...running]) { if (!cv.isConnected) { running.delete(cv); continue; } draw(cv, t); } if (running.size && !reduce) raf = requestAnimationFrame(loop); }
  window.__mountDNA = () => { document.querySelectorAll("canvas.dna").forEach(cv => running.add(cv)); if (!raf) raf = requestAnimationFrame(loop); };
  window.addEventListener("resize", () => { if (!raf) raf = requestAnimationFrame(loop); });
})();
</script>
