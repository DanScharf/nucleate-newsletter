<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nucleate Technion · Newsletter Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310223B'/%3E%3Cpath d='M20 10c0 16 24 28 24 44M44 10c0 16-24 28-24 44' stroke='%2336C3B0' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M24 22h16M22 32h20M24 42h16' stroke='%23F2735E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy masthead band with the helix mark, tab rail on the band, light working surface below. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --sunk:#E9EEF3; --ink:#0F1D2E; --muted:#58697C; --line:#D8E0E8;
  --band:#10223B; --band-2:#16304F; --band-ink:#EAF2FA; --band-muted:#9FB3C8;
  --accent:#0C8C7E; --accent-ink:#FFFFFF; --accent-soft:#DCF2EE;
  --coral:#D9503B; --coral-soft:#FBE5E0; --warn:#A86500; --warn-soft:#FBF0D9; --ok:#1F7A55; --ok-soft:#DFF1E8;
  --helix-a:#36C3B0; --helix-b:#F2735E; --helix-rung:#6E86A3;
  --t-event:#0C8C7E; --t-funding:#B7791F; --t-job:#5B5BD6; --t-research:#2F7BC0; --t-industry:#6B7A8C; --t-opportunity:#D9503B; --t-tool:#8A5CC2;
  --m-meeting:#2F7BC0; --m-call:#5B5BD6; --m-idea:#D9503B; --m-other:#6B7A8C;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(15,29,46,.06),0 4px 14px rgba(15,29,46,.05);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A121C; --surface:#111C29; --sunk:#0D1722; --ink:#E5EDF5; --muted:#8FA1B4; --line:#223142;
  --band:#08111C; --band-2:#0F1E30; --band-ink:#EAF2FA; --band-muted:#8FA1B4;
  --accent:#3CCFBC; --accent-ink:#06201C; --accent-soft:#0F302C; --coral:#FF7C66; --coral-soft:#3A1E19; --warn:#F2BE5C; --warn-soft:#33280F; --ok:#6FD3A5; --ok-soft:#14302A;
  --helix-rung:#4A607A;
  --t-event:#3CCFBC; --t-funding:#F2BE5C; --t-job:#9C9CF5; --t-research:#6FB2F0; --t-industry:#A3B1C2; --t-opportunity:#FF7C66; --t-tool:#C29CF0;
  --m-meeting:#6FB2F0; --m-call:#9C9CF5; --m-idea:#FF7C66; --m-other:#A3B1C2;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121C; --surface:#111C29; --sunk:#0D1722; --ink:#E5EDF5; --muted:#8FA1B4; --line:#223142;
  --band:#08111C; --band-2:#0F1E30; --band-ink:#EAF2FA; --band-muted:#8FA1B4;
  --accent:#3CCFBC; --accent-ink:#06201C; --accent-soft:#0F302C; --coral:#FF7C66; --coral-soft:#3A1E19; --warn:#F2BE5C; --warn-soft:#33280F; --ok:#6FD3A5; --ok-soft:#14302A;
  --helix-rung:#4A607A;
  --t-event:#3CCFBC; --t-funding:#F2BE5C; --t-job:#9C9CF5; --t-research:#6FB2F0; --t-industry:#A3B1C2; --t-opportunity:#FF7C66; --t-tool:#C29CF0;
  --m-meeting:#6FB2F0; --m-call:#9C9CF5; --m-idea:#FF7C66; --m-other:#A3B1C2;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
img{max-width:100%} [hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)} code{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}

/* masthead */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.mast{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand svg{flex:none}
.brand .n1{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1}
.brand .n2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted);line-height:1.4}
.mast .sp{flex:1}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--band-muted)}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 12px 10px;text-decoration:none;color:var(--band-muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--band-ink)}
.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--helix-a)}
.tabs a .n{font-family:var(--mono);font-size:11px;margin-left:5px;opacity:.75}
main{padding-block:22px 64px}

/* controls */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.danger{color:var(--coral)}
.btn[disabled]{opacity:.5;cursor:default}
header .btn{background:transparent;border-color:rgba(255,255,255,.18);color:var(--band-ink)}
header .btn:hover{border-color:rgba(255,255,255,.4)}
header .btn.pri{background:var(--helix-a);border-color:var(--helix-a);color:#06201C}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-size:14px;font-weight:400}
label.f .req{color:var(--coral)}
.lh{display:flex;gap:8px;align-items:baseline}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0}
.sub{color:var(--muted);margin:0 0 18px;max-width:65ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}

/* type chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap}
.chip .dot,.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.chip.type{background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.chip.hot{background:var(--coral-soft);color:var(--coral)} .chip.soon{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)}
.typepick{display:flex;flex-wrap:wrap;gap:6px}
.typepick input{position:absolute;opacity:0;pointer-events:none}
.typepick label{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;background:var(--surface);color:var(--ink)}
.typepick label .dot{color:var(--tc)}
.typepick input:checked+label{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--surface));font-weight:600}
.typepick input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}

/* hero (home + landing) */
.hero{position:relative;overflow:hidden;background:var(--band);border:1px solid rgba(255,255,255,.07);color:var(--band-ink);border-radius:18px;padding:28px 28px 26px;margin-bottom:20px;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .hx{position:relative;max-width:560px}
.hero .kicker{font-family:var(--mono);font-size:12px;color:var(--helix-a);letter-spacing:.06em}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,48px);line-height:1.02;margin:8px 0 10px;letter-spacing:-.02em;text-wrap:balance}
.hero h1 .dash{color:var(--helix-b)}
.hero p{margin:0;color:var(--band-muted);max-width:46ch}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--band-ink)}
.hero .btn.pri{background:var(--helix-a);border-color:var(--helix-a);color:#06201C;font-weight:600}
.landing{min-height:calc(100vh - 160px);border-radius:22px;padding:40px 32px;justify-content:center}
.landing .hx{max-width:620px}
.landing h1{font-size:clamp(38px,7vw,72px)}
.landing .note{margin-top:14px;font-size:13px;color:var(--band-muted)}
@media (max-width:640px){.landing{justify-content:flex-end;padding:180px 22px 28px;min-height:calc(100vh - 150px)}.hero{padding-top:150px}}
.landing .err{margin-top:12px;background:rgba(255,124,102,.14);color:#FFD4CC;padding:8px 12px;border-radius:9px;display:inline-block}

/* home */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .v{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .v.small{font-size:17px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .l{font-size:12.5px;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.home-grid{grid-template-columns:1fr}}
.quick{display:flex;gap:8px}
.quick input{flex:1}
.agenda{display:flex;flex-direction:column}
.ag{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.ag:first-child{border-top:0}
.ag .dt{width:46px;flex:none;text-align:center;border-radius:9px;background:var(--sunk);padding:4px 0;line-height:1.1}
.ag .dt .d{font-family:var(--display);font-weight:800;font-size:18px}
.ag .dt .m{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ag .bd{min-width:0;flex:1}
.ag .t{font-weight:600;overflow-wrap:anywhere}
.ag .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ag .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--tc);flex:none}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
@media (max-width:700px){.board{grid-template-columns:repeat(5,84%);scroll-snap-type:x mandatory}.col{scroll-snap-align:start;align-self:start}}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px;min-width:0}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.col-h .c{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.card:hover{border-color:var(--muted);border-left-color:var(--tc)}
.card[draggable=true]{cursor:grab}
.card .t{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);min-width:0}
.card .foot{display:flex;align-items:center;gap:6px;justify-content:space-between}
.card .foot .meta{flex:1;flex-wrap:nowrap}
.card .foot .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.votes{display:flex;gap:3px;flex:none}
.votes button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 7px;cursor:pointer;font-size:12px;white-space:nowrap}
.votes button.on{background:var(--accent-soft);border-color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{color:var(--ink);display:block;font-family:var(--display);font-size:18px;margin-bottom:4px}
.colempty{color:var(--muted);font-size:12.5px;padding:8px 4px}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;flex-wrap:wrap}
.row .grow{flex:1 1 240px;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.group-h{margin:18px 0 8px;display:flex;gap:8px;align-items:baseline}
.group-h:first-child{margin-top:0}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-h h3{font-size:20px;font-weight:800;min-width:170px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--sunk);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;font-weight:600}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;text-align:start;border:0;font:inherit;color:inherit}
.cal .day:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.cal .day.out{background:var(--sunk);color:var(--muted)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .num{font-family:var(--mono);font-size:12px;width:24px;height:24px;display:inline-grid;place-items:center;border-radius:50%}
.cal .day.today .num{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal .ev{display:block;font-size:11.5px;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--ink);border-left:3px solid var(--tc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .more{font-size:11px;color:var(--muted);padding-left:4px}
.cal .dots{display:none;gap:3px;flex-wrap:wrap}
@media (max-width:700px){.cal .day{min-height:56px;padding:4px;align-items:center}.cal .ev,.cal .more{display:none}.cal .dots{display:flex}.cal .dots .dot{color:var(--tc);width:6px;height:6px}}
.daypanel{margin-top:16px}

/* issue */
.issue-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.issue-grid{grid-template-columns:1fr}}
.phone{background:#0B141A;border-radius:22px;padding:16px;border:1px solid var(--line)}
.phone .eyebrow{color:#9FB0BA}
.bubble{background:#E7FFDB;color:#111B21;border-radius:4px 12px 12px 12px;padding:10px 12px;white-space:pre-wrap;unicode-bidi:plaintext;text-align:start;overflow-wrap:anywhere;font-size:13.5px;line-height:1.45;max-height:70vh;overflow:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bubble{background:#005C4B;color:#E9EDEF}}
:root[data-theme="dark"] .bubble{background:#005C4B;color:#E9EDEF}
.bubble b{font-weight:700}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mini{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.mini:first-of-type{border-top:0}
.mini .t{flex:1;min-width:0;overflow-wrap:anywhere}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:24px}
.person{display:flex;flex-direction:column;gap:10px}
.person .hd{display:flex;align-items:center;gap:10px}
.person .av{width:38px;height:38px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--sunk);border-radius:9px;padding:6px 8px}
.stat .v{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted)}
.feed{display:flex;flex-direction:column}
.ev-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ev-row:first-child{border-top:0}
.ev-row .when{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.ev-row .txt{min-width:0;overflow-wrap:anywhere}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(6,14,24,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(600px,100%);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.drawer .dh{display:flex;align-items:center;gap:8px}
.drawer .dh h2{flex:1;margin:0;font-size:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
details.more[open] summary{margin-bottom:12px}
.dup{background:var(--warn-soft);border-radius:9px;padding:8px 10px;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.comment{display:flex;gap:8px;align-items:flex-start}

<script>
// ---------- DNA double helix (landing + home hero) ----------
(() => {
  const running = new Set();
  function draw(cv, t){
    const r = cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio||1);
    if (!r.width) return;
    if (cv.width !== Math.round(r.width*dpr) || cv.height !== Math.round(r.height*dpr)) { cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr); }
    const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,r.width,r.height);
    const cs = getComputedStyle(cv); const A = cs.getPropertyValue("--helix-a").trim(), B = cs.getPropertyValue("--helix-b").trim(), R = cs.getPropertyValue("--helix-rung").trim();
    const W = r.width, H = r.height; const narrow = W < 640;
    // helix runs diagonally on the right side (full width when narrow, faded behind text)
    const fx = parseFloat(cv.dataset.x0||"0.38"); const x0 = narrow ? -40 : W*fx, x1 = W + 40; const cy = narrow ? Math.min(H*0.2, 96) : H*0.5; const amp = narrow ? 38 : Math.min(H*0.28, 70); const k = (Math.PI*2)/ (narrow ? 210 : 260);
    const tilt = narrow ? 0 : -0.12;
    g.globalAlpha = 1;
    const pts = [];
    for (let x = x0; x <= x1; x += 4) { const ph = k*x + t; pts.push({x, y1: cy + tilt*(x-x0) + amp*Math.sin(ph), y2: cy + tilt*(x-x0) + amp*Math.sin(ph+Math.PI), z1: Math.cos(ph), z2: Math.cos(ph+Math.PI)}); }
    // rungs
    for (let i = 0; i < pts.length; i += 6) { const p = pts[i]; const depth = (p.z1+1)/2; g.strokeStyle = R; g.globalAlpha = 0.5*(0.4+0.6*Math.abs(Math.sin(k*p.x+t))); g.lineWidth = 2;
      g.beginPath(); g.moveTo(p.x, p.y1); g.lineTo(p.x, p.y2); g.stroke();
      const mid = (p.y1+p.y2)/2; g.lineWidth = 3; g.globalAlpha *= 1.3; g.strokeStyle = depth > .5 ? A : B; g.beginPath(); g.moveTo(p.x, p.y1); g.lineTo(p.x, mid); g.stroke(); g.strokeStyle = depth > .5 ? B : A; g.beginPath(); g.moveTo(p.x, mid); g.lineTo(p.x, p.y2); g.stroke(); }
    // strands: back first, then front, segment by segment for depth
    for (const pass of [0,1]) for (const [key, zk, col] of [["y1","z1",A],["y2","z2",B]]) {
      for (let i = 1; i < pts.length; i++) { const a = pts[i-1], b = pts[i]; const front = b[zk] > 0; if ((pass===1) !== front) continue;
        g.strokeStyle = col; g.globalAlpha = (front ? 1 : 0.35); g.lineWidth = front ? 5 : 3.5; g.lineCap = "round";
        g.beginPath(); g.moveTo(a.x, a[key]); g.lineTo(b.x, b[key]); g.stroke(); }
    }
    // nucleotide beads on the front
    for (let i = 0; i < pts.length; i += 6) { const p = pts[i]; for (const [y,z,c] of [[p.y1,p.z1,A],[p.y2,p.z2,B]]) { if (z <= 0.2) continue; g.globalAlpha = 1; g.fillStyle = c; g.beginPath(); g.arc(p.x, y, 3+2*z, 0, Math.PI*2); g.fill(); } }
    g.globalAlpha = 1;
  }
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let raf = 0, start = performance.now();
  function loop(now){ raf = 0; const t = (now - start)/1600; for (const cv of [...running]) { if (!cv.isConnected) { running.delete(cv); continue; } draw(cv, t); } if (running.size && !reduce) raf = requestAnimationFrame(loop); }
  window.__mountDNA = () => { document.querySelectorAll("canvas.dna").forEach(cv => running.add(cv)); if (!raf) raf = requestAnimationFrame(loop); };
  window.addEventListener("resize", () => { if (!raf) raf = requestAnimationFrame(loop); });
})();
</script>

<script>
(() => {
"use strict";
// ---------- constants ----------
const TYPES = [
  ["event","Event","--t-event"],["funding","Funding / Grant","--t-funding"],["job","Job / Internship","--t-job"],
  ["research","Research news","--t-research"],["industry","Industry news","--t-industry"],["opportunity","Call for applications","--t-opportunity"],["tool","Tool / Resource","--t-tool"]
];
const EMO = {event:"📅",funding:"💰",job:"💼",research:"🧪",industry:"🏭",opportunity:"📣",tool:"🧰"};
const TYPE = Object.fromEntries(TYPES.map(([k,l,c])=>[k,{label:l,color:`var(${c})`,emoji:EMO[k]}]));
const MKINDS = [["meeting","Team meeting","--m-meeting"],["call","Call / partner meeting","--m-call"],["idea","Potential event","--m-idea"],["other","Other","--m-other"]];
const MKIND = Object.fromEntries(MKINDS.map(([k,l,c])=>[k,{label:l,color:`var(${c})`}]));
const STAGES = [["found","Found"],["shortlist","Shortlisted"],["writing","Writing"],["issue","In this issue"],["archived","Archived"]];
const STAGE = Object.fromEntries(STAGES);
const SECTIONS = [
  {key:"soon",title:"⏰ Coming up this week",types:null},
  {key:"events",title:"📅 Events",types:["event"]},
  {key:"opps",title:"💰 Opportunities",types:["funding","job","opportunity"]},
  {key:"science",title:"🧪 Science & industry",types:["research","industry"]},
  {key:"resources",title:"🧰 Resources",types:["tool"]},
];
const AUDIENCES = ["All","BSc","MSc / PhD","Postdocs"];
const VIEWS = [["home","Home"],["board","Pipeline"],["calendar","Calendar"],["issue","This issue"],["places","Places"],["sources","Sources"],["team","Team"],["archive","Archive"]];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// ---------- state ----------
const now0 = new Date();
const S = {items:[],sources:[],activity:[],issues:[],meetings:[],settings:null,known:[],
  db:null,user:null,meId:null,profiles:{},canWrite:true,
  view:"home",f:{q:"",type:"",who:"",tag:""},drawer:null,
  cal:{y:now0.getFullYear(),m:now0.getMonth(),sel:null}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "";
const normUrl = u => (u||"").trim().toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/[?#].*$/,"").replace(/\/+$/,"");
const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch { return ""; } };
const z2 = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`;
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { if(!s) return null; const d=new Date(s+"T00:00:00"); return isNaN(d)?null:d; };
const daysTo = s => { const d=parseD(s); return d? Math.round((d-today())/864e5) : null; };
const fmtD = s => { const d=parseD(s); return d? d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : ""; };
const fmtDW = s => { const d=parseD(s); return d? d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}) : ""; };
const ago = ms => { const m=Math.round((Date.now()-ms)/6e4); if(m<1)return"now"; if(m<60)return m+"m"; const h=Math.round(m/60); if(h<24)return h+"h"; const d=Math.round(h/24); return d<8? d+"d" : new Date(ms).toLocaleDateString("en-GB",{day:"numeric",month:"short"}); };
const agoPhrase = ms => { const a=ago(ms); return a==="now"?"just now":/^\d+[mhd]$/.test(a)? a+" ago" : "on "+a; };
const plural = (n,w) => n+" "+w+(n===1?"":"s");
const nextStage = s => { const ix=STAGES.findIndex(x=>x[0]===(s||"found")); return ix>=0&&ix<STAGES.length-1? STAGES[ix+1][0] : null; };
const weekStart = (t=Date.now()) => { const d=new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); };
const settings = () => Object.assign({name:"Nucleate Technion Weekly",footer:"Forward to a friend who'd want this 🙌",nextIssue:1,draftIntro:"",owners:{}}, S.settings||{});
const nameOf = id => { if(!id) return "Someone"; const p=S.profiles[id]; return (p&&p.name) || (id===S.meId ? "You" : "Teammate"); };
const avOf = id => (S.profiles[id]&&S.profiles[id].avatarUrl) || "";
const avImg = id => avOf(id) ? `<img class="av" src="${esc(avOf(id))}" alt="" referrerpolicy="no-referrer">` : "";
const people = () => { const s=new Set(); if(S.meId) s.add(S.meId); S.known.forEach(id=>s.add(id)); S.items.forEach(i=>{i.addedBy&&s.add(i.addedBy); i.owner&&s.add(i.owner);}); S.activity.forEach(a=>a.by&&s.add(a.by)); return [...s]; };
const upvotes = it => Object.values(it.votes||{}).filter(v=>v===1).length;
const downvotes = it => Object.values(it.votes||{}).filter(v=>v===-1).length;
const tcol = t => (TYPE[t]||{color:"var(--t-industry)"}).color;
const tlabel = t => (TYPE[t]||{label:t||"Item"}).label;
let toastT; function toast(msg){ $("#layer").querySelector(".toast")?.remove(); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; $("#layer").append(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
function gcalUrl({title,date,time,endTime,location,details}){
  const p=new URLSearchParams({action:"TEMPLATE",text:title||"Event"});
  const d=(date||"").replace(/-/g,"");
  if(time){ const st=d+"T"+time.replace(":","")+"00"; let et;
    if(endTime) et=d+"T"+endTime.replace(":","")+"00"; else { const [h,m]=time.split(":").map(Number); const e=new Date(2000,0,1,h+1,m); et=d+"T"+z2(e.getHours())+z2(e.getMinutes())+"00"; }
    p.set("dates",st+"/"+et); p.set("ctz","Asia/Jerusalem"); }
  else { const nd=parseD(date); nd.setDate(nd.getDate()+1); p.set("dates",d+"/"+ymd(nd).replace(/-/g,"")); }
  if(location) p.set("location",location); if(details) p.set("details",details);
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

// ---------- data writes ----------
async function logAct(verb, title, itemId){ if(!S.db||!S.meId) return; try{ await S.db.collection("activity").add({by:S.meId,verb,title:String(title||"").slice(0,140),itemId:itemId||null,at:Date.now()}); }catch(e){} }
function writeErr(e){ if(e&&e.code==="quota_exceeded") toast("Storage is full. Delete some archived items."); else if(e&&e.code==="invalid_argument"){ toast("That change wasn't allowed. Check you're signed in with a listed account."); } else toast("Couldn't save. Check your connection and try again."); }
async function saveItem(id, data, isNew){
  try{ const ref = S.db.collection("items").doc(id||undefined); if(isNew) await ref.set(data); else await ref.update(data); return ref.id; }
  catch(e){ writeErr(e); throw e; }
}
async function saveSettings(patch){ const ref=S.db.doc("meta/settings"); try{ if(S.settings) await ref.update(patch); else await ref.set(Object.assign(settings(),patch)); }catch(e){ writeErr(e); } }

// ---------- rendering ----------
let raf=0; function render(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(doRender); }
function doRender(){
  const st=settings();
  $("#who").innerHTML = S.meId ? avImg(S.meId)+`<span>${esc(nameOf(S.meId))}</span>` : "";
  $("#btnNew").hidden = !S.canWrite || !S.db; $("#btnSettings").hidden = !S.db;
  const active = S.items.filter(i=>i.status!=="archived");
  const counts = {board:active.length, calendar:upcoming(30).length, places:active.filter(i=>i.location).length, issue:S.items.filter(i=>i.status==="issue").length, sources:S.sources.length, archive:S.issues.length};
  $("#tabs").innerHTML = S.db ? VIEWS.map(([k,l])=>`<a href="#${k}" ${S.view===k?'aria-current="page"':""}>${l}${counts[k]?`<span class="n">${counts[k]}</span>`:""}</a>`).join("") : "";
  const m=$("#main");
  if(!S.db){ m.innerHTML = window.__authScreen ? window.__authScreen() : `<div class="empty"><b>Opening the desk…</b></div>`; window.__mountDNA&&window.__mountDNA(); return; }
  const banner = S.canWrite ? "" : `<div class="banner">Your account can't save changes. Ask the owner to add your email to the database rules.</div>`;
  const v = {home:vHome,board:vBoard,calendar:vCalendar,places:vPlaces,issue:vIssue,sources:vSources,team:vTeam,archive:vArchive}[S.view]||vHome;
  const y=window.scrollY; const keep=document.activeElement&&document.activeElement.id==="quickUrl"?$("#quickUrl").value:null;
  m.innerHTML = banner + v(); window.scrollTo(0,y);
  if(keep!==null&&$("#quickUrl")){ $("#quickUrl").value=keep; $("#quickUrl").focus(); }
  window.__mountDNA&&window.__mountDNA();
  renderDrawer(); refreshProfiles();
}
let profT=0; function refreshProfiles(){
  if(!S.user) return; const ids=people().filter(id=>!S.profiles[id]); if(!ids.length) return;
  clearTimeout(profT); profT=setTimeout(async()=>{ try{ const ps=await S.user.profiles(ids); let ch=false; for(const id in ps){ if(!S.profiles[id]||S.profiles[id].name!==ps[id].name){S.profiles[id]=ps[id]; ch=true;} } if(ch) render(); }catch{} },50);
}

// calendar entries: items with a date + meetings
function entries(){
  const out=[];
  S.items.forEach(i=>{ if(i.date) out.push({kind:"item",id:i.id,date:i.date,time:"",title:i.title,sub:[tlabel(i.type),i.location].filter(Boolean).join(" · "),color:tcol(i.type),archived:i.status==="archived"}); });
  S.meetings.forEach(mt=>{ if(mt.date) out.push({kind:"meeting",id:mt.id,date:mt.date,time:mt.time||"",title:mt.title,sub:[MKIND[mt.kind]?.label||"Meeting",mt.time?mt.time+(mt.endTime?"–"+mt.endTime:""):"",mt.location].filter(Boolean).join(" · "),color:(MKIND[mt.kind]||MKIND.other).color}); });
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time||"99")<(b.time||"99")?-1:1);
}
function upcoming(days){ const t=ymd(today()); const e=new Date(today()); e.setDate(e.getDate()+days); const end=ymd(e); return entries().filter(x=>!x.archived&&x.date>=t&&x.date<=end); }
function agendaRow(x){ const d=parseD(x.date); return `<div class="ag" data-${x.kind==="item"?"open":"meet"}="${esc(x.id)}" style="--tc:${x.color}"><span class="bar"></span><div class="dt"><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString("en-GB",{month:"short"})}</div></div><div class="bd"><div class="t" dir="auto">${esc(x.title)}</div><div class="s" dir="auto">${esc(DOW[d.getDay()])} · ${esc(x.sub)}</div></div></div>`; }

function filtered(list){
  const {q,type,who,tag}=S.f; const ql=q.trim().toLowerCase();
  return list.filter(i=>(!type||i.type===type)&&(!who||i.addedBy===who||i.owner===who)&&(!tag||(i.tags||[]).includes(tag))&&(!ql||[i.title,i.summary,i.location,i.city,i.url,(i.tags||[]).join(" ")].join(" ").toLowerCase().includes(ql)));
}
function filterBar(){
  const tags=[...new Set(S.items.flatMap(i=>i.tags||[]))].sort();
  return `<div class="toolbar">
    <input type="search" id="fq" placeholder="Search titles, places, tags…" value="${esc(S.f.q)}" aria-label="Search">
    <select id="ftype" aria-label="Type"><option value="">All types</option>${TYPES.map(([k,l])=>`<option value="${k}" ${S.f.type===k?"selected":""}>${l}</option>`).join("")}</select>
    <select id="fwho" aria-label="Person"><option value="">Everyone</option>${people().map(id=>`<option value="${esc(id)}" ${S.f.who===id?"selected":""}>${esc(nameOf(id))}</option>`).join("")}</select>
    ${tags.length?`<select id="ftag" aria-label="Tag"><option value="">All tags</option>${tags.map(t=>`<option ${S.f.tag===t?"selected":""}>${esc(t)}</option>`).join("")}</select>`:""}
  </div>`;
}
function dateChip(i){
  if(i.date){ const d=daysTo(i.date); const cls=d<0?"":d<=2?"hot":d<=7?"soon":""; return `<span class="chip ${cls}">🗓 ${d===0?"Today":d===1?"Tomorrow":fmtD(i.date)}${d<0?" · past":""}</span>`; }
  if(i.deadline){ const d=daysTo(i.deadline); if(d>=0) return `<span class="chip ${d<=3?"hot":d<=7?"soon":""}">⏳ ${d===0?"today":d+"d left"}</span>`; }
  return "";
}
function card(i){
  const my=(i.votes||{})[S.meId]; const cc=Object.keys(i.comments||{}).length; const ns=nextStage(i.status);
  return `<div class="card" data-open="${esc(i.id)}" draggable="${S.canWrite}" data-id="${esc(i.id)}" style="--tc:${tcol(i.type)}">
    <div class="meta"><span class="chip type" style="--tc:${tcol(i.type)}"><span class="dot"></span>${esc(tlabel(i.type))}</span>${dateChip(i)}${i.recurring&&i.recurring!=="none"?`<span class="chip">↻ ${esc(i.recurring)}</span>`:""}</div>
    <div class="t" dir="auto">${esc(i.title||"Untitled")}</div>
    ${i.location?`<div class="meta" dir="auto">📍 ${esc(i.location)}</div>`:""}
    <div class="foot">
      <div class="meta">${avImg(i.addedBy)}${i.owner&&i.owner!==i.addedBy?" ✎ "+avImg(i.owner):""}<span>${esc(host(i.url))}</span>${cc?`<span>💬 ${cc}</span>`:""}</div>
      <div class="votes">${S.canWrite&&ns?`<button data-next="${esc(i.id)}" title="Move to ${esc(STAGE[ns])}" aria-label="Move to ${esc(STAGE[ns])}">→</button>`:""}<button data-vote="1" data-id="${esc(i.id)}" class="${my===1?"on":""}" aria-label="Upvote">👍 ${upvotes(i)||""}</button><button data-vote="-1" data-id="${esc(i.id)}" class="${my===-1?"on":""}" aria-label="Downvote">👎 ${downvotes(i)||""}</button></div>
    </div></div>`;
}

// ---- Home ----
function vHome(){
  const st=settings(); const inIssue=S.items.filter(i=>i.status==="issue").length;
  const up=upcoming(14); const nextMeet=entries().find(x=>x.kind==="meeting"&&x.date>=ymd(today()));
  const due=S.sources.filter(s=>!s.lastChecked||(Date.now()-s.lastChecked)/864e5>(s.freq||7)).length;
  const found=S.items.filter(i=>(i.status||"found")==="found").length;
  const hello = S.meId? (nameOf(S.meId).split(" ")[0]) : "";
  return `<section class="hero"><canvas class="dna" aria-hidden="true"></canvas><div class="hx">
      <div class="kicker">ISSUE #${st.nextIssue} · IN PROGRESS</div>
      <h1>Nucleate <span class="dash">–</span> Technion Branch</h1>
      <p>${hello?`Hi ${esc(hello)}. `:""}Collect what's happening in biotech around campus, decide together, and send the weekly digest to the group.</p>
      <div class="acts">${S.canWrite?`<button class="btn pri" data-act="new">+ Add item</button><button class="btn" data-act="new-meeting">+ Add meeting</button>`:""}<a class="btn" href="#issue">Open this issue</a></div>
    </div></section>
    <div class="tiles">
      <a class="tile" href="#issue"><span class="v">${inIssue}</span><span class="l">in this issue</span></a>
      <a class="tile" href="#calendar"><span class="v">${up.length}</span><span class="l">on the calendar, next 14 days</span></a>
      <a class="tile" href="#calendar"><span class="v small" dir="auto">${nextMeet?esc(nextMeet.title):"—"}</span><span class="l">${nextMeet?`next meeting · ${esc(fmtDW(nextMeet.date))}${nextMeet.time?" "+esc(nextMeet.time):""}`:"no meetings scheduled"}</span></a>
      <a class="tile" href="#sources"><span class="v">${due}</span><span class="l">${due===1?"source due for a check":"sources due for a check"}</span></a>
    </div>
    <div class="home-grid">
      <div class="panel"><div class="panel-h"><h3>Coming up</h3><a href="#calendar" class="hint">Full calendar →</a></div>
        ${up.length?`<div class="agenda">${up.slice(0,7).map(agendaRow).join("")}</div>`:`<div class="colempty">Nothing dated in the next two weeks. Add an event or a meeting and it shows up here.</div>`}</div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        ${S.canWrite?`<form class="panel" id="quickForm"><div class="panel-h"><h3>Quick add</h3><span class="hint">${found} waiting in Found</span></div>
          <div class="quick"><input id="quickUrl" type="url" placeholder="Paste a link…" aria-label="Link"><button class="btn pri" type="submit">Add</button></div>
          <div class="hint" style="margin-top:6px">The title fills in from the page when possible.</div></form>`:""}
        <div class="panel"><div class="panel-h"><h3>Latest activity</h3><a href="#team" class="hint">Team →</a></div>

// ---- Issue ----
function issueItems(){
  const its=S.items.filter(i=>i.status==="issue");
  const order=(a,b)=>(a.order??1e9)-(b.order??1e9)||((a.date||a.deadline||"9")<(b.date||b.deadline||"9")?-1:1);
  const out={}; SECTIONS.forEach(s=>out[s.key]=[]);
  its.forEach(i=>{ const d=i.date?daysTo(i.date):(i.deadline?daysTo(i.deadline):null); if(d!==null&&d>=0&&d<=7){out.soon.push(i);return;} const s=SECTIONS.find(s=>s.types&&s.types.includes(i.type)); (out[s?s.key:"resources"]).push(i); });
  for(const k in out) out[k].sort(order);
  return out;
}
function itemText(i){
  const lines=[`▪️ *${(i.title||"").trim()}*`];
  const body=(i.summary||i.why||"").trim(); if(body) lines.push(body);
  const meta=[]; if(i.date) meta.push("🗓 "+fmtDW(i.date)); if(i.location) meta.push("📍 "+i.location); else if(i.online) meta.push("🌐 Online"); if(i.deadline&&daysTo(i.deadline)>=0) meta.push("⏳ Apply by "+fmtDW(i.deadline));
  if(meta.length) lines.push("_"+meta.join(" · ")+"_");
  if(i.url) lines.push("🔗 "+i.url);
  return lines.join("\n");
}
function composeText(){
  const st=settings(); const secs=issueItems();
  const date=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  let t=`*${st.name}* · Issue #${st.nextIssue}\n_${date}_\n`;
  if((st.draftIntro||"").trim()) t+=`\n${st.draftIntro.trim()}\n`;
  SECTIONS.forEach(s=>{ const its=secs[s.key]; if(!its.length) return; t+=`\n━━━━━━━━━━\n*${s.title}*\n\n`+its.map(itemText).join("\n\n")+"\n"; });
  if((st.footer||"").trim()) t+=`\n━━━━━━━━━━\n${st.footer.trim()}`;
  return t;
}
function waHtml(t){ return esc(t).replace(/\*([^*\n]+)\*/g,"<b>$1</b>").replace(/(^|[\s(])_([^_\n]+)_/g,"$1<i>$2</i>"); }
function vIssue(){
  const st=settings(); const secs=issueItems(); const total=Object.values(secs).reduce((a,b)=>a+b.length,0);
  const ownerSel=(key)=>`<select data-owner="${key}" aria-label="Section owner" ${S.canWrite?"":"disabled"}><option value="">Unassigned</option>${people().map(id=>`<option value="${esc(id)}" ${st.owners&&st.owners[key]===id?"selected":""}>${esc(nameOf(id))}</option>`).join("")}</select>`;
  const left=`<div class="list" style="gap:12px">

    </div>`).join("")}</div>`;
  const right=`<div><div class="phone"><div class="eyebrow" style="margin-bottom:8px">WhatsApp preview</div><div class="bubble" dir="auto">${waHtml(composeText())}</div></div>

}
function commentsHtml(it){ const cs=Object.entries(it.comments||{}).map(([k,v])=>({k,...v})).sort((a,b)=>a.at-b.at);
  return cs.length? cs.map(c=>`<div class="comment">${avImg(c.by)}<div class="b"><div class="n">${esc(nameOf(c.by))} · ${ago(c.at)}</div><div dir="auto">${esc(c.text)}</div></div></div>`).join("") : `<div class="colempty">No notes yet.</div>`; }
function readForm(){ const d=S.drawer.draft, v=id=>{const e=$("#"+id); return e? e.value : undefined;}; const ty=document.querySelector('input[name="dType"]:checked');
  Object.assign(d,{type:ty?ty.value:d.type,title:(v("dTitle")||"").trim(),url:(v("dUrl")||"").trim(),summary:(v("dSummary")??d.summary??"").trim(),date:v("dDate")||"",location:(v("dLoc")||"").trim(),city:(v("dCity")??d.city??"").trim(),audience:v("dAud")??d.audience,recurring:v("dRec")??d.recurring,sourceId:v("dSrc")??d.sourceId??"",tags:(v("dTags")??(d.tags||[]).join(",")).split(",").map(s=>s.trim()).filter(Boolean)});
  if($("#dStatus")) d.status=$("#dStatus").value;
  if(d.location && /^online$/i.test(d.location)) d.online=true;
  return d; }
function rerenderDrawer(){ S.drawer.v=(S.drawer.v||0)+1; renderDrawer(); }

// Fetch the page title for a pasted link (free microlink.io preview service; fails quietly).
const metaCache={};
async function fetchMeta(url){
  if(!safeUrl(url)) return; const D=S.drawer; if(!D) return;
  const box=$("#formErr"); if(box) box.innerHTML=`<div class="hint">Looking up the page title…</div>`;
  try{
    const m = metaCache[url] || (metaCache[url] = await fetch("https://api.microlink.io/?url="+encodeURIComponent(url)).then(r=>r.json()));
    if(S.drawer!==D) return; readForm();
    if(m&&m.status==="success"&&m.data){ if(!D.draft.title&&m.data.title) D.draft.title=String(m.data.title).trim().slice(0,160); if(!D.draft.summary&&m.data.description) D.draft.summary=String(m.data.description).trim().slice(0,280); rerenderDrawer(); const b=$("#formErr"); if(b) b.innerHTML=`<div class="hint">Filled from the page. Check it before saving.</div>`; }
    else { const b=$("#formErr"); if(b) b.innerHTML=""; }
  }catch{ const b=$("#formErr"); if(b) b.innerHTML=""; }
}
async function submitItem(){
  const D=S.drawer, d=readForm(); const miss=[];
  if(!d.title) miss.push("a title"); if(d.type==="event"&&!d.date) miss.push("a date"); if(d.type==="event"&&!d.location) miss.push("a location");
  if(miss.length){ $("#formErr").innerHTML=`<div class="dup">Add ${miss.join(", ").replace(/, ([^,]*)$/," and $1")} first.</div>`; return; }
  if(!D.id && !D.dupAck){ const nu=normUrl(d.url), nt=d.title.toLowerCase();
    const dup=S.items.find(i=>(nu&&normUrl(i.url)===nu)||(i.title||"").trim().toLowerCase()===nt);
    if(dup){ D.dup=dup; D.dupAck=true; rerenderDrawer(); return; } }
  const now=Date.now(); const fields=(({type,status,title,url,summary,date,location,city,audience,recurring,sourceId,online,tags})=>({type,status,title,url,summary,date,location,city,audience,recurring,sourceId,online:!!online,tags}))(d);
  try{
    if(!D.id){ fields.status="found"; const id=await saveItem(null,Object.assign(fields,{addedBy:S.meId,owner:null,votes:{},comments:{},createdAt:now,updatedAt:now,updatedBy:S.meId}),true); logAct("added",d.title,id); toast("Added to the desk."); }
    else { const prev=S.items.find(i=>i.id===D.id); await saveItem(D.id,Object.assign(fields,{updatedAt:now,updatedBy:S.meId})); logAct(prev&&prev.status!==d.status?`moved to ${STAGE[d.status]}:`:"edited",d.title,D.id); toast("Saved."); }
    closeDrawer();
  }catch{}
}

// ---------- meeting drawer ----------
function openMeeting(id, date){ const mt=id? S.meetings.find(x=>x.id===id) : null; if(id&&!mt) return; $("#layer").querySelector('.scrim')?.remove();
  S.drawer={kind:"meeting",id:id||null,draft:Object.assign({title:"",kind:"meeting",date:date||ymd(today()),time:"",endTime:"",location:"",notes:""},mt||{}),confirmDel:false}; renderDrawer(); }
function renderMeeting(old){
  const D=S.drawer, d=D.draft, mt=D.id?S.meetings.find(x=>x.id===D.id):null, ro=!S.canWrite, dis=ro?"disabled":"";
  if(old && old.dataset.for===("m-"+(D.id||"new")) && old.dataset.v===String(D.v||0)) return;
  old&&old.remove();
  const el=document.createElement("div"); el.className="scrim"; el.dataset.for="m-"+(D.id||"new"); el.dataset.v=String(D.v||0);
  el.innerHTML=`<div class="drawer" role="dialog" aria-modal="true" aria-label="Meeting">
    <div class="dh"><h2>${D.id?"Calendar entry":"Add to the calendar"}</h2><button class="btn ghost" data-act="close" aria-label="Close">✕</button></div>
    ${mt?`<div class="hint">Added by ${esc(nameOf(mt.createdBy))} ${mt.createdAt?agoPhrase(mt.createdAt):""}</div>`:""}
    <form class="box" id="meetForm" novalidate>
      <label class="f"><span class="lh">What<span class="req">*</span></span><input id="mTitle" dir="auto" value="${esc(d.title)}" placeholder="Weekly sync · Call with BioHub · Idea: lab-tour night" ${dis}></label>
      <div class="typepick" role="radiogroup" aria-label="Kind">${MKINDS.map(([k,l,c])=>`<input type="radio" name="mKind" id="mk-${k}" value="${k}" ${d.kind===k?"checked":""} ${dis}><label for="mk-${k}" style="--tc:var(${c})"><span class="dot"></span>${l}</label>`).join("")}</div>
      <div class="grid2">
        <label class="f"><span class="lh">Date<span class="req">*</span></span><input id="mDate" type="date" value="${esc(d.date)}" ${dis}></label>
        <label class="f">Start<input id="mTime" type="time" value="${esc(d.time)}" ${dis}></label>
        <label class="f">End<input id="mEnd" type="time" value="${esc(d.endTime)}" ${dis}></label>
      </div>
      <label class="f">Where<input id="mLoc" dir="auto" value="${esc(d.location)}" placeholder="Room, building, or a Zoom / Meet link" ${dis}></label>
      <label class="f">Notes<textarea id="mNotes" rows="3" dir="auto" placeholder="Agenda, who's coming, next steps" ${dis}>${esc(d.notes)}</textarea></label>
      <div id="mErr"></div>
      ${ro?"":`<div class="toolbar" style="margin:0"><button class="btn pri" type="submit">${D.id?"Save changes":"Add to calendar"}</button>${mt?`<a class="btn" target="_blank" rel="noopener" href="${esc(gcalUrl({title:mt.title,date:mt.date,time:mt.time,endTime:mt.endTime,location:mt.location,details:mt.notes}))}">+ Google Calendar</a>`:""}<span style="flex:1"></span>${mt?`<button type="button" class="btn ghost danger" data-act="mdel">Delete</button>`:""}</div>
      ${D.confirmDel?`<div class="confirm">Delete this entry? <button type="button" class="btn sm danger" data-act="mdel-yes">Delete</button><button type="button" class="btn sm" data-act="mdel-no">Keep</button></div>`:""}`}
    </form></div>`;
  $("#layer").append(el); if(!D.id) setTimeout(()=>el.querySelector("#mTitle")?.focus(),30);
}
function readMeeting(){ const d=S.drawer.draft; const k=document.querySelector('input[name="mKind"]:checked'); Object.assign(d,{title:$("#mTitle").value.trim(),kind:k?k.value:"meeting",date:$("#mDate").value,time:$("#mTime").value,endTime:$("#mEnd").value,location:$("#mLoc").value.trim(),notes:$("#mNotes").value.trim()}); return d; }
async function submitMeeting(){
  const D=S.drawer, d=readMeeting(); if(!d.title||!d.date){ $("#mErr").innerHTML=`<div class="dup">Add ${!d.title&&!d.date?"a title and a date":!d.title?"a title":"a date"} first.</div>`; return; }
  const data={title:d.title,kind:d.kind,date:d.date,time:d.time,endTime:d.endTime,location:d.location,notes:d.notes,updatedAt:Date.now(),updatedBy:S.meId};
  try{ if(D.id){ await S.db.collection("meetings").doc(D.id).update(data); logAct("updated meeting",d.title); }
    else { await S.db.collection("meetings").add(Object.assign(data,{createdBy:S.meId,createdAt:Date.now()})); logAct(d.kind==="idea"?"added an event idea:":"scheduled",d.title+" · "+fmtDW(d.date)); }
    closeDrawer(); toast(D.id?"Saved.":"Added to the calendar."); }catch(e){ writeErr(e); }
}

// ---------- actions ----------
async function vote(id,val){
  if(!S.canWrite) return; const it=S.items.find(i=>i.id===id); if(!it) return;
  const cur=(it.votes||{})[S.meId]; const nv=cur===val?0:val;
  try{ await S.db.collection("items").doc(id).update({votes:{[S.meId]:nv}});
    if(nv===1){ logAct("upvoted",it.title,id);
      const ups=Object.entries(Object.assign({},it.votes,{[S.meId]:1})).filter(([,v])=>v===1).length;
      if(ups>=2&&["found","shortlist","writing"].includes(it.status||"found")){ await S.db.collection("items").doc(id).update({status:"issue",updatedAt:Date.now(),updatedBy:S.meId}); logAct("auto-added to the issue:",it.title,id); toast("Two 👍 — moved into this issue."); } }
  }catch(e){ writeErr(e); }
}
async function moveStage(id,stage){ const it=S.items.find(i=>i.id===id); if(!it||(it.status||"found")===stage) return; try{ await saveItem(id,{status:stage,updatedAt:Date.now(),updatedBy:S.meId}); logAct(`moved to ${STAGE[stage]}:`,it.title,id); }catch{} }
async function moveInSection(id,sec,dir){
  const list=issueItems()[sec]; const ix=list.findIndex(i=>i.id===id); const j=ix+dir; if(ix<0||j<0||j>=list.length) return;
  const arr=list.slice(); [arr[ix],arr[j]]=[arr[j],arr[ix]];
  for(let k=0;k<arr.length;k++){ if(arr[k].order!==k){ try{ await S.db.collection("items").doc(arr[k].id).update({order:k}); }catch(e){ writeErr(e); return; } } }
}
function shiftDate(s,rec){ const d=parseD(s); if(!d) return ""; if(rec==="weekly") d.setDate(d.getDate()+7); else if(rec==="monthly") d.setMonth(d.getMonth()+1); else if(rec==="yearly") d.setFullYear(d.getFullYear()+1); return ymd(d); }
async function sendIssue(){
  const st=settings(); const its=S.items.filter(i=>i.status==="issue"); const text=composeText(); const n=st.nextIssue;
  try{
    await S.db.collection("issues").doc("issue-"+n).set({number:n,text,itemIds:its.map(i=>i.id),intro:st.draftIntro||"",sentAt:Date.now(),sentBy:S.meId});
    for(const i of its){ await S.db.collection("items").doc(i.id).update({status:"archived",issueNo:n,order:null,updatedAt:Date.now(),updatedBy:S.meId});
      if(i.recurring&&i.recurring!=="none"){ const now=Date.now(); const c=JSON.parse(JSON.stringify(i)); delete c.id; Object.assign(c,{status:"found",issueNo:null,votes:{},comments:{},owner:null,order:null,date:shiftDate(i.date,i.recurring),deadline:shiftDate(i.deadline,i.recurring),createdAt:now,updatedAt:now,addedBy:S.meId,tags:[...new Set([...(i.tags||[]),"recurring"])]}); await S.db.collection("items").add(c); } }
    await saveSettings({nextIssue:n+1,draftIntro:""});
    logAct("sent issue",`#${n} (${its.length} items)`,null); toast(`Issue #${n} archived. On to #${n+1}.`);
  }catch(e){ writeErr(e); }
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast("Copied. Paste it into WhatsApp."); }catch{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.append(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy");}catch{} ta.remove(); toast(ok?"Copied. Paste it into WhatsApp.":"Couldn't copy automatically. Select the preview text and copy it."); } }

document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act],[data-open],[data-meet],[data-vote],[data-next],[data-check],[data-delsrc],[data-move],[data-copyissue],[data-cal],[data-day]"); if(!t) { if(e.target.classList.contains("scrim")) closeDrawer(); return; }
  if(t.dataset.next){ const it=S.items.find(i=>i.id===t.dataset.next); const ns=it&&nextStage(it.status); if(ns){ await moveStage(it.id,ns); toast(`Moved to ${STAGE[ns]}.`); } return; }
  if(t.dataset.vote){ vote(t.dataset.id,Number(t.dataset.vote)); return; }
  if(t.dataset.open){ e.preventDefault(); openDrawer(t.dataset.open); return; }
  if(t.dataset.meet){ openMeeting(t.dataset.meet); return; }
  if(t.dataset.cal!==undefined){ const n=Number(t.dataset.cal); if(n===0){ const d=new Date(); S.cal.y=d.getFullYear(); S.cal.m=d.getMonth(); S.cal.sel=ymd(today()); } else { const d=new Date(S.cal.y,S.cal.m+n,1); S.cal.y=d.getFullYear(); S.cal.m=d.getMonth(); } render(); return; }
  if(t.dataset.day){ S.cal.sel = S.cal.sel===t.dataset.day? null : t.dataset.day; const d=parseD(t.dataset.day); if(d.getMonth()!==S.cal.m){ S.cal.y=d.getFullYear(); S.cal.m=d.getMonth(); } render(); return; }
  if(t.dataset.check){ const s=S.sources.find(x=>x.id===t.dataset.check); try{ await S.db.collection("sources").doc(t.dataset.check).update({lastChecked:Date.now(),lastCheckedBy:S.meId}); logAct("checked source",s&&s.name); }catch(er){writeErr(er);} return; }
  if(t.dataset.delsrc){ const s=S.sources.find(x=>x.id===t.dataset.delsrc); try{ await S.db.collection("sources").doc(t.dataset.delsrc).delete(); logAct("removed source",s&&s.name); }catch(er){writeErr(er);} return; }
  if(t.dataset.move){ moveInSection(t.dataset.move,t.dataset.sec,Number(t.dataset.dir)); return; }
  if(t.dataset.copyissue){ const is=S.issues.find(x=>x.id===t.dataset.copyissue); is&&copyText(is.text); return; }
  const a=t.dataset.act;
  if(a==="new") openDrawer(null, t.dataset.date?{date:t.dataset.date,type:"event"}:null);
  else if(a==="new-meeting") openMeeting(null, t.dataset.date);
  else if(a==="close") closeDrawer();
  else if(a==="settings") openSettings();
  else if(a==="claim"||a==="unclaim"){ const id=S.drawer.id, it=S.items.find(i=>i.id===id); readForm(); try{ await saveItem(id,{owner:a==="claim"?S.meId:null}); if(a==="claim"){ logAct("is writing",it.title,id); if((it.status||"found")!=="issue"&&it.status!=="archived"){ await saveItem(id,{status:"writing",updatedAt:Date.now(),updatedBy:S.meId}); S.drawer.draft.status="writing"; } } S.drawer.draft.owner=a==="claim"?S.meId:null; rerenderDrawer(); }catch{} }
  else if(a==="reload-item"){ openDrawer(S.drawer.id); }
  else if(a==="del"){ readForm(); S.drawer.confirmDel=true; rerenderDrawer(); }
  else if(a==="del-no"){ readForm(); S.drawer.confirmDel=false; rerenderDrawer(); }
  else if(a==="del-yes"){ const id=S.drawer.id, it=S.items.find(i=>i.id===id); try{ await S.db.collection("items").doc(id).delete(); logAct("deleted",it&&it.title); closeDrawer(); toast("Deleted."); }catch(er){writeErr(er);} }
  else if(a==="mdel"){ readMeeting(); S.drawer.confirmDel=true; rerenderDrawer(); }
  else if(a==="mdel-no"){ readMeeting(); S.drawer.confirmDel=false; rerenderDrawer(); }
  else if(a==="mdel-yes"){ const id=S.drawer.id, mt=S.meetings.find(x=>x.id===id); try{ await S.db.collection("meetings").doc(id).delete(); logAct("removed from calendar:",mt&&mt.title); closeDrawer(); toast("Deleted."); }catch(er){writeErr(er);} }
  else if(a==="copy-issue") copyText(composeText());
  else if(a==="send-issue"){ const n=settings().nextIssue; $("#sendConfirm").innerHTML=`<div class="confirm">Archive issue #${n} and its ${S.items.filter(i=>i.status==="issue").length} items? Recurring items come back for next time. <button class="btn sm pri" data-act="send-yes">Yes, mark sent</button><button class="btn sm" data-act="send-no">Not yet</button></div>`; }
  else if(a==="send-yes") sendIssue();
  else if(a==="send-no") $("#sendConfirm").innerHTML="";
  else if(a==="save-settings"){ const name=$("#stName").value.trim()||"Nucleate Technion Weekly", footer=$("#stFooter").value; await saveSettings({name,footer}); closeDrawer(); toast("Settings saved."); }
});
document.addEventListener("submit", async e=>{
  e.preventDefault(); const id=e.target.id;
  if(id==="itemForm") submitItem();
  else if(id==="meetForm") submitMeeting();
  else if(id==="quickForm"){ const u=$("#quickUrl").value.trim(); if(!u) return; $("#quickUrl").value=""; openDrawer(null,{url:/^https?:\/\//i.test(u)?u:"https://"+u}); }
  else if(id==="cForm"){ const inp=$("#cText"); const text=inp.value.trim(); if(!text) return; const iid=S.drawer.id, it=S.items.find(i=>i.id===iid); const cid="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    inp.value=""; try{ await S.db.collection("items").doc(iid).update({comments:{[cid]:{by:S.meId,text:text.slice(0,2000),at:Date.now()}}}); logAct("commented on",it.title,iid); }catch(er){ inp.value=text; writeErr(er); } }
  else if(id==="srcForm"){ const name=$("#sName").value.trim(); if(!name) return; const url=$("#sUrl").value.trim();
    if(url&&S.sources.some(s=>normUrl(s.url)===normUrl(url))){ toast("That source is already in the library."); return; }
    try{ await S.db.collection("sources").add({name,url,kind:$("#sKind").value,freq:Number($("#sFreq").value),lastChecked:0,lastCheckedBy:null,addedBy:S.meId,createdAt:Date.now()}); logAct("added source",name); e.target.reset(); }catch(er){writeErr(er);} }
});
document.addEventListener("input", e=>{
  if(e.target.id==="fq"){ S.f.q=e.target.value; clearTimeout(S._qT); S._qT=setTimeout(()=>{ render(); requestAnimationFrame(()=>{ const q=$("#fq"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length);} }); },200); }
});
document.addEventListener("change", e=>{
  const id=e.target.id;
  if(id==="ftype"){S.f.type=e.target.value;render();} else if(id==="fwho"){S.f.who=e.target.value;render();} else if(id==="ftag"){S.f.tag=e.target.value;render();}
  else if(id==="intro"){ saveSettings({draftIntro:e.target.value}); }
  else if(id==="dUrl"){ const u=e.target.value.trim(); if(u&&S.drawer&&!S.drawer.id){ readForm(); if(!S.drawer.draft.title) fetchMeta(u); } }
  else if(e.target.name==="dType"&&S.drawer){ readForm(); rerenderDrawer(); }
  else if(e.target.dataset.owner){ const owners=Object.assign({},settings().owners,{[e.target.dataset.owner]:e.target.value||null}); saveSettings({owners}); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&$("#layer").querySelector(".scrim")) closeDrawer(); });
// drag & drop between columns
let dragId=null;
document.addEventListener("dragstart", e=>{ const c=e.target.closest&&e.target.closest(".card[draggable=true]"); if(!c) return; dragId=c.dataset.id; e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",dragId);}catch{} });
document.addEventListener("dragover", e=>{ const col=e.target.closest&&e.target.closest(".col"); if(!col||!dragId) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(c=>c!==col&&c.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("dragleave", e=>{ const col=e.target.closest&&e.target.closest(".col"); if(col&&!col.contains(e.relatedTarget)) col.classList.remove("over"); });
document.addEventListener("drop", e=>{ const col=e.target.closest&&e.target.closest(".col"); document.querySelectorAll(".col.over").forEach(c=>c.classList.remove("over")); if(!col||!dragId) return; e.preventDefault(); moveStage(dragId,col.dataset.stage); dragId=null; });
document.addEventListener("dragend", ()=>{ dragId=null; document.querySelectorAll(".col.over").forEach(c=>c.classList.remove("over")); });

function openSettings(){
  S.drawer=null; const st=settings(); const L=$("#layer"); L.querySelector(".scrim")?.remove();
  const el=document.createElement("div"); el.className="scrim"; el.dataset.kind="settings"; el.innerHTML=`<div class="drawer" role="dialog" aria-modal="true" aria-label="Settings"><div class="dh"><h2>Settings</h2><button class="btn ghost" data-act="close" aria-label="Close">✕</button></div>
    <div class="box"><label class="f">Newsletter name<input id="stName" dir="auto" value="${esc(st.name)}" ${S.canWrite?"":"disabled"}></label>
    <label class="f">Sign-off line at the bottom of each issue<textarea id="stFooter" rows="2" dir="auto" ${S.canWrite?"":"disabled"}>${esc(st.footer)}</textarea></label>
    ${S.canWrite?`<div><button class="btn pri" data-act="save-settings">Save</button></div>`:""}</div>
    <div class="box"><h3>Adding a teammate</h3><p class="sub" style="margin:0">In the Firebase console, open Firestore → Rules, add their Google email to the list, and click Publish. Then send them this page's address.</p></div>
  </div>`;
  L.append(el);
}

// ---------- routing ----------
function route(){ const h=location.hash.replace("#",""); S.view=VIEWS.some(v=>v[0]===h)?h:"home"; render(); }
window.addEventListener("hashchange",route);
window.addEventListener("people-changed",e=>{ S.known=e.detail||[]; S.profiles={}; render(); });

// ---------- boot ----------
async function boot(){
  route();
  if(!window.claude||!window.claude.use){ render(); return; }
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  S.db=db; S.user=user;
  if(user){ S.meId=await user.id(); const w=await user.can("data.write"); if(w===false) S.canWrite=false; }
  if(!S.meId) S.canWrite=false;
  if(!db){ render(); return; }
  const onErr=e=>{ if(e&&e.code==="revoked"){ S.db=null; render(); } };
  const sub=(name,key,q)=>(q||db.collection(name)).onSnapshot(s=>{ S[key]=s.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },onErr);
  sub("items","items"); sub("sources","sources"); sub("issues","issues"); sub("meetings","meetings");
  sub("activity","activity",db.collection("activity").orderBy("at","desc").limit(80));
  db.doc("meta/settings").onSnapshot(s=>{ S.settings=s.exists? s.data() : null; render(); },onErr);
  render();
}
window.__startApp = boot;
})();
</script>
